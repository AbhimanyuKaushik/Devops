
<!DOCTYPE html>
<html>
<head>
    <title>To-Do Page</title>
</head>
<body>
    <h1>My To-Do List</h1>

    <form action="/submittodoitem" method="POST">
        <label>Item Name</label>
        <input type="text" name="itemName" required>

        <br><br>

        <label>Item ID</label>
        <input type="number" name="itemId" required>

        <br><br>

        <label>Item UUID</label>
        <input type="text" name="itemUUID" required>

        <br><br>

        <label>Item Description</label>
        <textarea name="itemDescription" required></textarea>

        <br><br>

        <button type="submit">Submit Item</button>
    </form>
</body>
</html>
